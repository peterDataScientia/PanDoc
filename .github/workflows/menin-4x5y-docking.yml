name: MEN1 4X5Y PanDoc Redocking and Repurposing
run-name: MEN1 MI-503 reference plus 3 candidates

on:
  push:
    branches:
      - menin-4x5y-docking-20261105
    paths:
      - .github/workflows/menin-4x5y-docking.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  menin-redocking-and-screening:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated MEN1 experiment branch
        uses: actions/checkout@v4
      - name: Authenticate to PanDoc compute container
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull pinned PanDoc compute stack
        run: docker pull ghcr.io/peterdatascientia/pandoc-compute:latest
      - name: Run Menin reference redocking and candidate dockings
        run: |
          docker run --rm \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ghcr.io/peterdatascientia/pandoc-compute:latest \
            python -u scripts/menin_4x5y_docking.py
      - name: Upload all docking inputs outputs and partial failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menin-4x5y-all-results
          path: menin_4x5y_results/
          if-no-files-found: warn
          retention-days: 30
