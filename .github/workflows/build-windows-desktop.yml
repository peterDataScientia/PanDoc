name: Build PanDoc Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows-desktop.yml'
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows-desktop.yml'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.11'
          activate-environment: pandoc-desktop
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false

      - name: Install scientific libraries
        shell: pwsh
        run: |
          conda install -y -n pandoc-desktop -c conda-forge python=3.11 rdkit openmm pdbfixer boost-cpp libboost swig

      - name: Install application requirements
        shell: pwsh
        run: |
          $lines = Get-Content requirements.txt | Where-Object {
            $_ -notmatch '^\s*(pdbfixer|openmm|rdkit|vina|--only-binary)' -and $_ -notmatch '^\s*#'
          }
          $lines | Set-Content requirements-desktop-build.txt
          # Force PowerShell to fail on subprocess errors (native commands do not throw by default).
          conda run -n pandoc-desktop python -m pip install -r requirements-desktop-build.txt
          if ($LASTEXITCODE -ne 0) { throw "PanDoc dependency installation failed" }
          conda run -n pandoc-desktop python -m pip install -r desktop/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Desktop dependency installation failed" }
          # Vina has no official Windows wheel; build its Python binding against conda Boost and SWIG.
          conda run -n pandoc-desktop python -m pip install --no-build-isolation "vina==1.2.7"
          if ($LASTEXITCODE -ne 0) { throw "Windows Vina binding compilation failed" }

      - name: Verify critical imports
        run: |
          conda run -n pandoc-desktop python -c "import streamlit, rdkit, meeko, vina, openmm, pdbfixer, webview; print('PanDoc desktop dependencies OK')"
          if ($LASTEXITCODE -ne 0) { throw "Scientific import check failed" }

      - name: Bundle desktop application
        run: |
          conda run -n pandoc-desktop python -m PyInstaller --noconfirm --clean --onedir --windowed --name PanDoc --paths . --add-data "app.py;." --add-data "pandoc;pandoc" --add-data "assets;assets" --collect-all streamlit --collect-all rdkit --collect-all meeko --collect-all vina --collect-all openmm --collect-all pdbfixer --collect-all py3Dmol --collect-all webview --collect-all propka --collect-all molscrub --hidden-import streamlit.web.cli desktop/launcher.py

      - name: Smoke-test frozen Streamlit server
        run: |
          $env:PANDOC_DESKTOP_PORT = "18762"
          $env:PANDOC_DATA_DIR = Join-Path $env:RUNNER_TEMP "PanDocTestData"
          $process = Start-Process -FilePath "dist\\PanDoc\\PanDoc.exe" -ArgumentList "--pandoc-server" -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 90; $i++) {
              if ($process.HasExited) { throw "Frozen PanDoc server exited with code $($process.ExitCode)" }
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:18762/_stcore/health" -TimeoutSec 2 -UseBasicParsing
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $healthy) { throw "Frozen PanDoc server failed health check" }
            Write-Host "Frozen PanDoc Streamlit health endpoint passed."
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Compile Windows installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "desktop\installer.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PanDoc-Setup-Windows-x64
          path: dist-installer/PanDoc-Setup-Windows-x64.exe
          if-no-files-found: error
