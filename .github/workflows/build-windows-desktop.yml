name: Build PanDoc Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows-desktop.yml'
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows-desktop.yml'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.11'
          activate-environment: pandoc-desktop
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false

      - name: Install scientific libraries
        shell: pwsh
        run: |
          conda install -y -n pandoc-desktop -c conda-forge python=3.11 rdkit openmm pdbfixer

      - name: Install application requirements
        shell: pwsh
        run: |
          $lines = Get-Content requirements.txt | Where-Object {
            $_ -notmatch '^\s*(pdbfixer|openmm|rdkit|vina|--only-binary)' -and $_ -notmatch '^\s*#'
          }
          $lines | Set-Content requirements-desktop-build.txt
          # Force PowerShell to fail on subprocess errors (native commands do not throw by default).
          conda run -n pandoc-desktop python -m pip install -r requirements-desktop-build.txt
          if ($LASTEXITCODE -ne 0) { throw "PanDoc dependency installation failed" }
          conda run -n pandoc-desktop python -m pip install -r desktop/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Desktop dependency installation failed" }

      - name: Verify critical imports
        run: |
          conda run -n pandoc-desktop python -c "import streamlit, rdkit, meeko, openmm, pdbfixer, webview; print('PanDoc desktop dependencies OK')"
          if ($LASTEXITCODE -ne 0) { throw "Scientific import check failed" }

      - name: Download verified official Windows Vina executable
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/vendor" | Out-Null
          $url = "https://github.com/ccsb-scripps/AutoDock-Vina/releases/download/v1.2.7/vina_1.2.7_win.exe"
          & curl.exe --fail --location --retry 3 --output "desktop/vendor/vina.exe" $url
          if ($LASTEXITCODE -ne 0) { throw "Official Vina binary download failed" }
          if ((Get-Item "desktop/vendor/vina.exe").Length -lt 100000) { throw "Downloaded Vina binary unexpectedly small" }
          & "desktop/vendor/vina.exe" --help | Select-Object -First 12
          if ($LASTEXITCODE -ne 0) { throw "Vina Windows executable cannot run" }

      - name: Bundle desktop application
        run: |
          conda run -n pandoc-desktop python -m PyInstaller --noconfirm --clean --onedir --windowed --name PanDoc --paths . --add-data "app.py;." --add-data "pandoc;pandoc" --add-data "assets;assets" --add-binary "desktop/vendor/vina.exe;bin" --collect-all streamlit --collect-all rdkit --collect-all meeko --collect-all cryptography --collect-all openmm --collect-all pdbfixer --collect-all py3Dmol --collect-all webview --collect-all propka --collect-all molscrub --hidden-import meeko.cli.mk_prepare_receptor --hidden-import streamlit.web.cli desktop/launcher.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }

      - name: Verify frozen application imports and encryption
        timeout-minutes: 1
        run: |
          $env:PANDOC_SELFTEST_LOG = Join-Path $env:RUNNER_TEMP "pandoc-frozen-selftest.log"
          $process = Start-Process -FilePath "dist\\PanDoc\\PanDoc.exe" -ArgumentList "--pandoc-selftest" -PassThru -Wait
          if (Test-Path $env:PANDOC_SELFTEST_LOG) {
            Write-Host "=== Frozen application self-test ==="
            Get-Content $env:PANDOC_SELFTEST_LOG
          } else { throw "Frozen app did not create self-test log" }
          if ($process.ExitCode -ne 0) { throw "Frozen app imports/cryptography self-test failed ($($process.ExitCode))" }
          if (-not (Select-String -Path $env:PANDOC_SELFTEST_LOG -Pattern "PanDoc application imports: OK" -Quiet)) {
            throw "Frozen application did not complete all imports"
          }

      - name: Smoke-test frozen Streamlit server
        timeout-minutes: 2
        run: |
          $env:PANDOC_DESKTOP_PORT = "18762"
          $env:PANDOC_DATA_DIR = Join-Path $env:RUNNER_TEMP "PanDocTestData"
          $env:PANDOC_DESKTOP_LOG = Join-Path $env:RUNNER_TEMP "pandoc-desktop-server.log"
          $process = Start-Process -FilePath "dist\\PanDoc\\PanDoc.exe" -ArgumentList "--pandoc-server" -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 35; $i++) {
              if ($process.HasExited) { throw "Frozen PanDoc server exited with code $($process.ExitCode)" }
              if (Test-Path $env:PANDOC_DESKTOP_LOG) {
                $lastLines = Get-Content $env:PANDOC_DESKTOP_LOG -Tail 40 -ErrorAction SilentlyContinue
                if ($lastLines -match "Traceback \(most recent call last\)|ModuleNotFoundError:|ImportError:|FileNotFoundError:") {
                  throw "Frozen PanDoc reported a startup exception; see log below"
                }
              }
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:18762/_stcore/health" -TimeoutSec 1 -UseBasicParsing
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) { throw "Frozen PanDoc health check timed out; inspect log below" }
            Write-Host "Frozen PanDoc Streamlit health endpoint passed."
          } finally {
            if (Test-Path $env:PANDOC_DESKTOP_LOG) {
              Write-Host "=== Frozen PanDoc startup log ==="
              Get-Content $env:PANDOC_DESKTOP_LOG -Tail 150
            } else { Write-Warning "No PanDoc server log created" }
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Compile Windows installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "desktop\installer.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PanDoc-Setup-Windows-x64
          path: dist-installer/PanDoc-Setup-Windows-x64.exe
          if-no-files-found: error
