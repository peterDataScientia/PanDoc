name: Browser automation contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app.py"
      - "pandoc/ui.py"
      - "assets/**"
      - "tests/browser/**"
      - "requirements-browser.txt"
      - ".github/workflows/browser-contract.yml"

jobs:
  playwright-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PanDoc and browser-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Start PanDoc locally
        run: |
          nohup streamlit run app.py             --server.headless true             --server.address 127.0.0.1             --server.port 8501             > streamlit-browser-contract.log 2>&1 &
          echo $! > streamlit-browser-contract.pid

      - name: Wait for Streamlit
        run: |
          python - <<'PY'
          import time, urllib.request
          url = "http://127.0.0.1:8501/_stcore/health"
          for _ in range(120):
              try:
                  with urllib.request.urlopen(url, timeout=2) as r:
                      if r.status == 200:
                          print("PanDoc is ready")
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("PanDoc did not become ready in 120 seconds")
          PY

      - name: Run Playwright automation-contract test
        env:
          PANDOC_E2E_URL: http://127.0.0.1:8501
        run: python tests/browser/test_automation_contract.py

      - name: Upload browser-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandoc-browser-contract
          path: |
            test-artifacts/browser-contract/
            streamlit-browser-contract.log
          if-no-files-found: warn
          retention-days: 14
