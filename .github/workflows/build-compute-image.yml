name: Build PanDoc Compute Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - requirements.txt
      - Dockerfile.compute
      - .github/workflows/build-compute-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push compute image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.compute
          push: true
          tags: ghcr.io/peterdatascientia/pandoc-compute:latest
          labels: org.opencontainers.image.source=https://github.com/peterDataScientia/PanDoc
          cache-from: type=gha
          cache-to: type=gha,mode=max
