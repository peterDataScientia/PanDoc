name: 5E9C glycan preparation check
on:
  pull_request:
    paths:
      - 'pandoc/glycans.py'
      - 'pandoc/core.py'
      - 'scripts/validate_5e9c_redocking.py'
      - 'tests/test_5e9c_glycan_smoke.py'
      - '.github/workflows/glycan-5e9c.yml'
  workflow_dispatch:
jobs:
  glycan-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install glycan preparation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'rdkit>=2024.9,<2027' 'gemmi>=0.6,<1' 'requests>=2.31,<3' 'meeko==0.8.0' 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Prepare and redock 5E9C at pH 5.5
        env:
          # Keep pull-request checks fast. Full three-seed Vina validation is
          # an opt-in workflow_dispatch run; past completed runs remain evidence.
          PANDOC_RUN_5E9C_REDOCK: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python -m pip install 'vina==1.2.7' 'pdbfixer==1.12.0' 'openmm>=8.2,<9' 'propka>=3.5,<4' pytest
          python -m pytest -s -q tests/test_5e9c_glycan_smoke.py
