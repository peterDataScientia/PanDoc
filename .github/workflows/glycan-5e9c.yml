name: 5E9C glycan preparation check
on:
  push:
    branches: [fix/glycan-reference-selection]
  workflow_dispatch:
jobs:
  glycan-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install glycan preparation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'rdkit>=2024.9,<2027' 'gemmi>=0.6,<1' 'requests>=2.31,<3' 'meeko==0.8.0' 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Fetch and prepare complete 5E9C glycan
        run: python -m tests.test_5e9c_glycan_smoke
